<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automation M0 Input Target</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      position: relative;
      background:
        linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,0)),
        #dbeafe;
      font-family: Arial, sans-serif;
    }
    #status {
      position: absolute;
      left: 24px;
      top: 20px;
      min-width: 360px;
      padding: 12px 16px;
      border: 3px solid #1e3a8a;
      border-radius: 8px;
      background: white;
      color: #172554;
      font-size: 20px;
      font-weight: 700;
    }
    #target {
      position: absolute;
      left: 420px;
      top: 245px;
      width: 188px;
      height: 82px;
      border: 6px solid #7f1d1d;
      border-radius: 14px;
      background: #ef4444;
      color: white;
      font-size: 25px;
      font-weight: 800;
      box-shadow: 0 8px 0 #991b1b;
    }
    #target.clicked {
      border-color: #14532d;
      background: #22c55e;
      box-shadow: 0 8px 0 #166534;
    }
    #keySink {
      position: absolute;
      left: 24px;
      bottom: 24px;
      width: 420px;
      padding: 12px;
      border: 2px solid #475569;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="status">READY clicks=0 keys=</div>
  <button id="target" type="button">CLICK TARGET</button>
  <input id="keySink" aria-label="keyboard target" placeholder="keyboard target">
  <script>
    (() => {
      const state = { clicks: 0, keys: '' };
      const status = document.querySelector('#status');
      const target = document.querySelector('#target');
      const keySink = document.querySelector('#keySink');
      const params = new URLSearchParams(location.search);
      const targetX = Number(params.get('x'));
      const targetY = Number(params.get('y'));
      if (Number.isFinite(targetX)) target.style.left = `${targetX}px`;
      if (Number.isFinite(targetY)) target.style.top = `${targetY}px`;
      const render = () => {
        status.textContent = `READY clicks=${state.clicks} keys=${state.keys}`;
        document.title = `clicks:${state.clicks};keys:${state.keys}`;
      };
      target.addEventListener('click', (event) => {
        state.clicks += 1;
        target.classList.toggle('clicked', state.clicks % 2 === 1);
        target.dataset.lastTrusted = String(event.isTrusted);
        render();
      });
      keySink.addEventListener('keydown', (event) => {
        if (event.key.length === 1) state.keys += event.key;
        keySink.dataset.lastTrusted = String(event.isTrusted);
        render();
      });
      window.__automationProbe = {
        snapshot: () => ({
          ...state,
          targetTrusted: target.dataset.lastTrusted || '',
          keyTrusted: keySink.dataset.lastTrusted || '',
          visibilityState: document.visibilityState,
          targetRect: target.getBoundingClientRect().toJSON(),
          keyRect: keySink.getBoundingClientRect().toJSON(),
        }),
      };
      render();
    })();
  </script>
</body>
</html>
