<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>设置</title>
    <!--
      首帧底色：`--surface-page` 由 JS 从 Fluent token 注入，脚本执行前页面是白的——
      深色主题下会闪一下白？这里用 `prefers-color-scheme`（跟随 nativeTheme.themeSource）
      先铺 **和 `--surface-page`（Fluent `colorNeutralBackground2`）完全相同的**底色，
      Vue 挂载后再由设计 token 接管。取错一档（例如 #f5f5f5）等于加载时先闪一下再归位。
      tests/unit/brand-tokens.test.ts 盯着这几个值。
    -->
    <style>
      html { background: #fafafa; }
      @media (prefers-color-scheme: dark) { html { background: #1f1f1f; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
