<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>设置</title>
    <!--
      这里**不写任何颜色**：`bao://` 的响应在返回 HTML 前，会把解析好的主题
      （`data-theme` + 整套 Fluent 变量）注入到 `<head>` 最前面（见
      `shared/internal-bootstrap.ts`），所以第一帧就有正确底色，不会"白一下再变深色"。

      过去这里手抄了一份 `#fafafa / #1f1f1f` 的近似底色，还抄错过一档——副本必然会漂。
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
