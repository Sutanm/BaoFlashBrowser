<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新标签页</title>
    <!--
      这里**不写任何颜色**，也**不画关键首帧骨架**（2026-11-26 重做）。

      `bao://` 的响应在返回 HTML 之前，会把解析好的主题（`data-theme` + 整套 Fluent 变量）
      与首屏快照注入到 `<head>` 最前面（见 `shared/internal-bootstrap.ts`），所以第一帧
      画出来的就是真页面、且配色正确。

      过去这里有 `#ntp-first-paint` 骨架 + 一套 `--critical-*` 配色副本，代价是：
        - 副本会漂移（`--critical-brand` 曾留着 Fluent 的蓝，NTP 第一帧 logo 是蓝的）；
        - 骨架与真页面是两套 DOM，交接那一刻（`remove()` + `opacity` 门控）必然跳一下。
      现在只有一个 DOM、一份配色。
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./newtab.ts"></script>
  </body>
</html>
