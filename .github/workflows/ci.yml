name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Userscript and CSS fixer smokes (Windows)
        if: runner.os == 'Windows'
        run: npm run test:userscripts && npm run test:userscripts-admin && npm run test:css-fixer && npm run test:smokes
      - name: Userscript and CSS fixer smokes (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a npm run test:userscripts
          xvfb-run -a npm run test:userscripts-admin
          xvfb-run -a npm run test:css-fixer
          xvfb-run -a npm run test:smokes
      - name: Verify build artifacts are fresh
        run: node tools/probe/host.cjs --only 00
      - name: BrowserView smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:electron && npm run test:ruffle && npm run test:compat
      - name: BrowserView smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox tests/electron/browserview-smoke.cjs
          node tests/electron/build-automation-m2-visual.mjs
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox release/tests/automation-m5-ruffle-visual-smoke.cjs
          node tests/electron/build-compatibility-smoke.mjs
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox release/tests/session-compatibility-smoke.cjs

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: build:win64
            artifact: baoflashbrowser-win64
            path: |
              release/BaoFlashBrowser-*-x64.exe
              release/BaoFlashBrowser-*-x64.exe.blockmap
          - os: windows-latest
            command: build:win32
            artifact: baoflashbrowser-win32
            path: |
              release/BaoFlashBrowser-*-ia32.exe
              release/BaoFlashBrowser-*-ia32.exe.blockmap
          - os: ubuntu-latest
            command: build:linux
            artifact: baoflashbrowser-linux-x64
            path: release/BaoFlashBrowser-*-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.command }}
      - name: Upload candidate package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
