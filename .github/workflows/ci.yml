name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: BrowserView smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:electron && npm run test:ruffle && npm run test:compat
      - name: BrowserView smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox tests/electron/browserview-smoke.cjs
          node tests/electron/build-automation-m2-visual.mjs
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox release/tests/automation-m5-ruffle-visual-smoke.cjs
          node tests/electron/build-compatibility-smoke.mjs
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox release/tests/session-compatibility-smoke.cjs

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: build:win64
          - os: windows-latest
            command: build:win32
          - os: ubuntu-latest
            command: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.command }}
