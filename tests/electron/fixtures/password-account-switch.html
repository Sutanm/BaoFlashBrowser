<!doctype html>
<meta charset="utf-8">
<title>JSONP 登录换账号回归页</title>
<main id="panel"></main>
<script>
  window.loginCount = 0;
  window.showLogin = function () {
    document.getElementById('panel').innerHTML = '<form id="login"><input name="username" autocomplete="username"><input name="password" type="password"><button type="submit">登录</button></form>';
    document.getElementById('login').onsubmit = function (event) {
      event.preventDefault();
      var form = event.target;
      var script = document.createElement('script');
      script.src = '/jsonp?username=' + encodeURIComponent(form.username.value) + '&password=' + encodeURIComponent(form.password.value);
      script.onload = function () { window.loginOk(); script.remove(); };
      document.head.appendChild(script);
    };
  };
  window.loginOk = function () {
    window.loginCount++;
    document.getElementById('panel').innerHTML = '<p>已登录</p><button onclick="showLogin()">退出</button>';
  };
  showLogin();
</script>
