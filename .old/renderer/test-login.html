<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录测试</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
  .card { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 360px; }
  h2 { text-align: center; margin-bottom: 24px; }
  label { display: block; margin-bottom: 4px; font-size: 14px; color: #555; }
  input { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  button { width: 100%; padding: 12px; background: #533483; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
  button:hover { background: #6a43a8; }
  .result { margin-top: 16px; padding: 10px; border-radius: 4px; text-align: center; display: none; }
  .result.success { background: #e8f5e9; color: #2e7d32; display: block; }
  .result.ajax { background: #e3f2fd; color: #1565c0; display: block; }
</style>
</head>
<body>

<div class="card">
  <h2>登录测试页面</h2>

  <h3 style="font-size:14px; color:#888;">场景1：传统 form submit</h3>
  <form id="login-form-1" action="about:blank" method="get" target="_self">
    <label>用户名</label>
    <input type="text" name="username" id="user1" placeholder="输入用户名" autocomplete="username">
    <label>密码</label>
    <input type="password" name="password" id="pass1" placeholder="输入密码" autocomplete="current-password">
    <button type="submit">提交登录 (form submit)</button>
  </form>

  <hr style="margin:24px 0; border:none; border-top:1px solid #eee;">

  <h3 style="font-size:14px; color:#888;">场景2：无 form 的 AJAX 登录（回车触发）</h3>
  <label>用户名</label>
  <input type="text" id="user2" placeholder="输入用户名" autocomplete="username">
  <label>密码</label>
  <input type="password" id="pass2" placeholder="输入密码后按回车" autocomplete="current-password">
  <button id="btn-ajax" type="button">AJAX 登录 (点击按钮)</button>
  <div id="result-ajax" class="result ajax"></div>

  <hr style="margin:24px 0; border:none; border-top:1px solid #eee;">

  <h3 style="font-size:14px; color:#888;">场景3：iframe 内的登录表单</h3>
  <iframe src="test-login-iframe.html" style="width:100%; height:320px; border:1px solid #ddd; border-radius:4px;"></iframe>
</div>

<script>
  document.getElementById('btn-ajax').addEventListener('click', function() {
    var user = document.getElementById('user2').value;
    var pass = document.getElementById('pass2').value;
    var result = document.getElementById('result-ajax');
    result.textContent = 'AJAX 登录成功！(username=' + user + ')';
    result.className = 'result ajax';
  });
</script>
</body>
</html>
